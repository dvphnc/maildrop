<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#111111"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1DB954;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#1DB954;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#1DB954;stop-opacity:0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bg)" rx="12"/>

  <!-- Glow effect -->
  <ellipse cx="400" cy="60" rx="300" ry="80" fill="#1DB954" opacity="0.08" filter="url(#blur)"/>

  <!-- Animated grid lines -->
  <g opacity="0.06" stroke="#1DB954" stroke-width="0.5">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="700" y1="0" x2="700" y2="200"/>
  </g>

  <!-- Top green line -->
  <rect x="0" y="0" width="800" height="2" fill="url(#glow)" rx="12">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Logo circle -->
  <circle cx="400" cy="75" r="28" fill="#1DB954">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <path d="M388 69 C388 67.8 388.9 67 390 67 L410 67 C411.1 67 412 67.8 412 69 L412 81 C412 82.2 411.1 83 410 83 L390 83 C388.9 83 388 82.2 388 81 Z M412 71 L400 78 L388 71" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Title -->
  <text x="400" y="122" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="-1" fill="white">
    MailDrop
    <animate attributeName="opacity" values="0;1" dur="1s" begin="0.3s" fill="freeze"/>
  </text>

  <!-- Subtitle -->
  <text x="400" y="148" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#555" letter-spacing="2">
    PAY · SEND · DONE
    <animate attributeName="opacity" values="0;1" dur="1s" begin="0.6s" fill="freeze"/>
  </text>

  <!-- Bottom green line -->
  <rect x="0" y="198" width="800" height="2" fill="url(#glow)" rx="12">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner dots -->
  <circle cx="16" cy="16" r="3" fill="#1DB954" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="784" cy="16" r="3" fill="#1DB954" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="16" cy="184" r="3" fill="#1DB954" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="784" cy="184" r="3" fill="#1DB954" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
